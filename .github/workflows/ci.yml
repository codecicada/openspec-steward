# CI for openspec-steward.
#
# This repository is a Claude Code plugin and an npm package at once. CI can
# exercise the package half in full, but not load the plugin: that needs
# ${CLAUDE_PLUGIN_ROOT}, which does not exist on a runner. What it can do for
# the plugin half is validate it statically (the `plugin` job).
#
# Until this workflow existed, the package had no test runner of its own. The
# only thing that ran its tests was a repository installing it, whose own test
# script invokes the *installed* copy's suite — so a broken commit on master
# was discovered downstream rather than here. That is backwards for a package
# meant to have several consumers.
name: CI

on:
  # Push only to master. A push to a branch with an open PR also fires
  # `pull_request`, and `concurrency` cannot fold the two together: their refs
  # differ (refs/heads/<branch> vs refs/pull/<n>/merge), so every job ran twice.
  # `pull_request` covers branches under review, and it tests the merge result.
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A superseded run tells you nothing; let the newest push win.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-head:
    name: archive head
    runs-on: ubuntu-26.04

    # Decides whether this head may skip the test jobs: only when the push since
    # a head whose check runs all read success touched nothing but `openspec/`
    # and `todo/` — an archive commit, in practice — and the base has not moved
    # under it. Conditions and wiring: docs/archive-head.md.
    #
    # It runs on EVERY event, never behind an `if:`. A job whose `needs` was
    # skipped is skipped too, so gating this one would silently skip every test
    # job on exactly the events it was never meant to judge. Off a pull request
    # `synchronize` it decides skip=false without touching git or the API.
    #
    # Fails closed: anything it cannot evaluate is skip=false, and a crash makes
    # this job red, which leaves the jobs behind it `skipped` on a red build.
    permissions:
      contents: read
      checks: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      # Full history: `before`, the PR head and the base must all be in the
      # clone for the ancestry checks. An unreachable SHA reads as skip=false.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/archive-head/index.mjs
          --event "${{ github.event.action || github.event_name }}"
          --before "${{ github.event.before }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --base "origin/${{ github.base_ref }}"

  specs:
    name: specification checks
    runs-on: ubuntu-26.04

    # The one job that judges what an archive commit changes, so it never
    # depends on `archive head`: it runs on every head, skip or not. Before this
    # job existed, the "second cycle" after an archive re-ran every test here
    # and checked nothing the archive had touched.
    #
    # `strict` shells out to `npx --no-install openspec`, so the CLI is
    # installed without saving it: the package keeps zero dependencies. Pinned
    # exactly, because a minor release adding a validation rule would redden a
    # build that changed nothing here.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm install --no-save --no-audit --no-fund @fission-ai/openspec@1.15.0

      - run: node scripts/check-specs/index.mjs --root .

  # Unit tests on three Node versions: 22 is what the consumer's CI runs on, 20
  # is the floor declared in `engines`, and 24 is what development happens on
  # today. The three are not padding: `run-tests.sh` exists *because* these
  # versions disagree about what `node --test` accepts as an argument — a
  # directory fails on 22 and 24, a glob fails on 20. That script's workaround
  # is only held to its claim if all three actually run it.
  #
  # Three jobs, not a matrix, because they are gated on `archive head`. A
  # matrix job skipped by a job-level `if:` is never expanded: it reports ONE
  # check named `unit tests (node ${{ matrix.node }})`, so the required checks
  # `unit tests (node 20|22|24)` never report and the ruleset blocks the merge.
  # Seen on this repository's first archive head (56dccf8). A plain job keeps
  # its static name when skipped, and a skipped required check satisfies the
  # ruleset.
  #
  # Each is pinned to the current LTS image rather than `ubuntu-latest`, which
  # still resolves to 24.04 and moves underneath you when GitHub migrates it. A
  # runner image that changes on GitHub's schedule can redden or green a build
  # that changed nothing here.
  #
  # The checker needs no git history, so the default shallow checkout is
  # deliberate. No install step: the package has no dependencies, so there is
  # nothing to install and no lockfile for `npm ci` to read.
  unit-20:
    name: unit tests (node 20)
    needs: archive-head
    if: needs.archive-head.outputs.skip != 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm test

  unit-22:
    name: unit tests (node 22)
    needs: archive-head
    if: needs.archive-head.outputs.skip != 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test

  unit-24:
    name: unit tests (node 24)
    needs: archive-head
    if: needs.archive-head.outputs.skip != 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test

  bin:
    name: bin smoke test
    needs: archive-head
    if: needs.archive-head.outputs.skip != 'true'
    runs-on: ubuntu-26.04

    # One Node version, not the matrix. This job tests the packaging surface —
    # how npm installs a bin and how the entry guard survives the symlink —
    # which does not vary by language version, and each run installs from the
    # registry. 22 matches the consumer.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Covers what `unit` structurally cannot. The unit tests import each
      # `lib/` module directly and never reach the entry point, so when the
      # bin silently exited 0 through its npm symlink (fixed in e1567a4) all
      # 37 of them stayed green. Verified: reintroducing that guard leaves
      # `npm test` at 37 passed while this job fails.
      #
      # It installs @fission-ai/openspec from the registry, which makes this
      # the one job here that needs network beyond the checkout.
      - run: sh scripts/check-specs/smoke-bin.sh

  gates:
    name: gate refusals
    needs: archive-head
    if: needs.archive-head.outputs.skip != 'true'
    runs-on: ubuntu-26.04

    # The `/start-change` and `/stop-change` gates are prose, so this job cannot
    # run them. What it holds them to is weaker and still worth having: every
    # refusal they claim rests on a condition a command can observe, and that
    # command says something different in the refusing state than in the
    # adjacent permitting one. A gate whose refusal condition is not observable
    # is a sentence, and would be paraphrased away without anything noticing.
    #
    # One observation is not a refusal: `--abandon` destroys a branch, so the
    # harness deletes both branches and restores the work from the verified tag
    # in a clone that never had it. "Recoverable" is a claim, and an unexercised
    # claim is the empty green this repository refuses everywhere else.
    #
    # Watched failing before being trusted, six mutations, each reddening only
    # what reads it: the name search narrowed to `-maxdepth 1`; the abandon pin
    # checked with a local `git tag -l` instead of `git ls-remote`; the tag push
    # skipped while the destroy runs anyway (pin check AND recovery); the resume
    # marker stubbed present; the recorded head stubbed resolvable; and the
    # second-change search no longer excluding the resumed change's own name.
    #
    # git only — no network beyond the checkout, no `gh`, no `openspec`.
    steps:
      - uses: actions/checkout@v7

      - run: sh scripts/gates/refusal-cases.sh

  plugin:
    name: plugin validate
    needs: archive-head
    if: needs.archive-head.outputs.skip != 'true'
    runs-on: ubuntu-26.04

    # No other job reads the plugin manifests or the skill and command
    # frontmatter, so a broken one passed CI and failed only when a consumer
    # installed the plugin. This runs Claude Code's own validator over them,
    # `--strict`, from a pinned CLI.
    #
    # It needs no credentials: the script runs the validator with an empty HOME
    # and no ANTHROPIC_API_KEY, here and locally alike, so that claim is
    # observed on every run rather than inherited from the runner.
    #
    # Watched failing before being trusted: the script also validates three
    # broken copies of the tree (invalid plugin.json, a skill without
    # frontmatter, unparseable command frontmatter) and expects each to fail.
    # Dropping `--strict` reddens exactly the frontmatter-less skill.
    #
    # Not covered, even under --strict: a marketplace `source` pointing at a
    # directory that does not exist, and a marketplace entry whose name differs
    # from plugin.json.
    #
    # Installs @anthropic-ai/claude-code from the registry, so this job needs
    # network beyond the checkout. 22 matches the other single-version jobs.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: sh scripts/plugin/validate.sh
